name: Provision Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to provision'
        required: true
        type: choice
        options:
          - dev
          - prod
      solution:
        description: 'Solution to be provisioned.'
        required: true
        type: string

jobs:
  provision:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: select environment
        id: select_environment
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ "$ENV" != "dev" ] && [ "$ENV" != "prod" ]; then
            echo "Invalid environment for deployment: $ENV. Allowed values are 'dev' or 'prod'."
            exit 1
          fi
          echo "ENVIRONMENT=$ENV" >> $GITHUB_OUTPUT
          echo "Environment to which deployment will be made: $ENV"
      
      - name: select solution
        id: select_solution
        run: |
          SOLUTION="${{ github.event.inputs.solution }}"
          echo "SOLUTION=$SOLUTION" >> $GITHUB_OUTPUT
          echo "Solution to be deployed: $SOLUTION"

      - name: normalize solution name
        id: normalize_solution
        run: |
          SOLUTION="${{ steps.select_solution.outputs.SOLUTION }}"
          FORMATTED_SOLUTION="${SOLUTION//-/_}"
          FORMATTED_SOLUTION="${FORMATTED_SOLUTION^^}"
          echo "FORMATTED_SOLUTION=$FORMATTED_SOLUTION" >> $GITHUB_OUTPUT
          echo "Formatted solution name: $FORMATTED_SOLUTION"
      
      - name: Resolve Doppler secret name
        id: resolve_secret
        env:
          SECRET_NAME: ${{ format('DOPPLER_{0}_{1}', steps.normalize_solution.outputs.FORMATTED_SOLUTION, steps.select_environment.outputs.ENVIRONMENT == 'dev' && 'DEV' || 'PROD') }}
        run: |
          echo "SECRET_NAME=$SECRET_NAME" >> $GITHUB_OUTPUT
          echo "Resolved secret name: $SECRET_NAME"

      - name: Select Doppler token
        id: select_doppler_token
        env:
          DOPPLER_TOKEN: ${{ secrets[ format('DOPPLER_{0}_{1}', steps.normalize_solution.outputs.FORMATTED_SOLUTION, steps.select_environment.outputs.ENVIRONMENT == 'dev' && 'DEV' || 'PROD') ] }}
        run: |
          echo "::add-mask::$DOPPLER_TOKEN"
          echo "DOPPLER_TOKEN=$DOPPLER_TOKEN" >> $GITHUB_OUTPUT

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      
      - name: Verify Doppler CLI
        run: doppler --version

      # Authenticate Doppler CLI
      - name: Setup Doppler
        run: doppler setup --token="${{ steps.select_doppler_token.outputs.DOPPLER_TOKEN }}" --no-interactive

      - name: Fetch terraform token from Doppler
        id: fetch_tf_token
        run: |
          TF_API_TOKEN=$(doppler secrets get TF_API_TOKEN --plain)
          echo "::add-mask::$TF_API_TOKEN"
          echo "TERRAFORM_CLOUD_TOKEN=$TF_API_TOKEN" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.13.4
          cli_config_credentials_token: ${{ steps.fetch_tf_token.outputs.TERRAFORM_CLOUD_TOKEN }}
      
      - name: Verify Terraform Setup
        run: terraform -version

      # Initialize Terraform for remote execution
      - name: Terraform Init
        run: doppler run -- terraform -chdir="stacks/${{ steps.select_solution.outputs.SOLUTION }}" init
        env:
          DOPPLER_TOKEN: ${{ steps.select_doppler_token.outputs.DOPPLER_TOKEN }}

      - name: Terraform Plan
        run: doppler run -- terraform -chdir="stacks/${{ steps.select_solution.outputs.SOLUTION }}" plan
        env:
          DOPPLER_TOKEN: ${{ steps.select_doppler_token.outputs.DOPPLER_TOKEN }}

      - name: Terraform Apply
        run: doppler run -- terraform -chdir="stacks/${{ steps.select_solution.outputs.SOLUTION }}" apply -auto-approve
        env:
          DOPPLER_TOKEN: ${{ steps.select_doppler_token.outputs.DOPPLER_TOKEN }}
      
      - name: Cleanup complete
        run: |
          echo "✅ Infrastructure provisioning complete for environment: ${{ steps.select_environment.outputs.ENVIRONMENT }}"
          